name: fe_doc_to_pdf
description: >-
  Operator app for the Word-to-PDF splitter: pick a Word document and a
  recipient sheet, split it into one PDF per recipient, then send each PDF over
  WhatsApp.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'
  # DropdownButtonFormField.initialValue needs Flutter >= 3.33 and
  # Color.withValues >= 3.27; verified against 3.47.4 / Dart 3.13.3.
  flutter: '>=3.33.0'

dependencies:
  flutter:
    sdk: flutter

  # API calls and multipart uploads.
  http: ^1.2.0
  # Picking the .docx and the .csv/.xlsx from device storage.
  file_picker: ^11.0.3
  # Opening wa.me links in WhatsApp.
  url_launcher: ^6.2.5
  # Handing the downloaded PDF to WhatsApp through the OS share sheet --
  # a wa.me link cannot carry an attachment.
  share_plus: ^10.1.0
  # Somewhere to keep the downloaded parts.
  path_provider: ^2.1.2
  # Remembering the API base URL between launches.
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
